        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedCattle:
      type: object
      description: |-
        Full Cattle serializer used for create, retrieve, and update operations.

        Extra computed field
        --------------------
        age_years : float
            Derived from ``date_of_birth``; read-only, not stored in the DB.

        Validation
        ----------
        * ``tag_number`` must be unique (checked against existing records,
          skipping the current instance on updates).
        * ``date_of_birth`` must not be in the future.
      properties:
        id:
          type: integer
          readOnly: true
        tag_number:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 100
        breed:
          type: string
          maxLength: 100
        date_of_birth:
          type: string
          format: date
        age_years:
          type: number
          format: double
          description: Cattle age in fractional years, computed from date_of_birth.
          readOnly: true
        gender:
          $ref: '#/components/schemas/GenderEnum'
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        purchase_date:
          type: string
          format: date
          nullable: true
        is_active:
          type: boolean
        notes:
          type: string
          maxLength: 1000
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedHeatCycleLog:
      type: object
      description: |-
        Serializer for HeatCycleLog records.

        Read fields
        -----------
        cattle_tag : str — tag_number of the related Cattle

        Write fields
        ------------
        cattle_id  : int — FK write path (accepts Cattle PK)
      properties:
        id:
          type: integer
          readOnly: true
        cattle_id:
          type: integer
          writeOnly: true
          description: PK of the active Cattle to associate this heat log with.
        cattle_tag:
          type: string
          readOnly: true
          description: Tag number of the cattle (read-only).
        observed_date:
          type: string
          format: date
        signs:
          type: string
        intensity:
          $ref: '#/components/schemas/IntensityEnum'
        recorded_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedMilkLog:
      type: object
      description: |-
        Full MilkLog serializer.

        Read fields
        -----------
        cattle_tag  : str   — tag_number of the related Cattle (display-only)
        total_litres: Decimal — auto-computed by the model; included in responses

        Write fields
        ------------
        cattle_id   : int   — FK write path (accepts the Cattle PK on POST/PUT)

        Validation
        ----------
        1. morning_litres must be >= 0
        2. evening_litres must be >= 0
        3. morning_litres + evening_litres must not exceed MAX_DAILY_LITRES (60 L)
        4. date must not be in the future
        5. (cattle, date) must be unique — checked against DB, skipping self on update
      properties:
        id:
          type: integer
          readOnly: true
        cattle_id:
          type: integer
          writeOnly: true
          description: PK of the Cattle record to associate this log with.
        cattle_tag:
          type: string
          readOnly: true
          description: Tag number of the cattle (read-only).
        date:
          type: string
          format: date
        morning_litres:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        evening_litres:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        total_litres:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
          readOnly: true
        recorded_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedPregnancyRecord:
      type: object
      description: |-
        Serializer for PregnancyRecord.

        Read fields
        -----------
        cattle_tag                 : str
        days_until_calving         : int  — days remaining to expected_calving_date;
                                            negative means overdue; None after calving
        gestation_progress_percent : float — 0–100 % of 280-day gestation completed;
                                              100 once calved or overdue

        Write fields
        ------------
        cattle_id  : int
        ai_event   : int (nullable) — PK of the linked ArtificialInsemination
      properties:
        id:
          type: integer
          readOnly: true
        cattle_id:
          type: integer
          writeOnly: true
        cattle_tag:
          type: string
          readOnly: true
        ai_event:
          type: integer
          nullable: true
        confirmed_date:
          type: string
          format: date
        expected_calving_date:
          type: string
          format: date
        actual_calving_date:
          type: string
          format: date
          nullable: true
        calf_gender:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/CalfGenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        is_active:
          type: boolean
        days_until_calving:
          type: integer
          nullable: true
          description: |-
            Days remaining until expected_calving_date.

            Returns None once the actual calving date is recorded (pregnancy over).
            Negative value means the animal is overdue.
          readOnly: true
        gestation_progress_percent:
          type: number
          format: double
          description: |-
            Percentage of the 280-day gestation period completed.

            Clamped to [0, 100]. Returns 100 once calved or overdue.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
