  /api/vet-reports/upload/:
    post:
      operationId: vet_reports_upload_create
      description: |-
        Upload a veterinary report PDF or TXT file and trigger AI summarisation.

        POST /api/vet-reports/upload/

        Request (multipart/form-data)
        -----------------------------
        cattle_id : int  (required) — PK of the Cattle this report belongs to
        file      : File (required) — PDF (.pdf) or plain text (.txt)

        Constraints
        -----------
        * Allowed MIME types: application/pdf, text/plain
        * Maximum file size: 10 MB
        * Cattle must exist and be active

        Response 202 — report accepted, summarisation queued
        ----------------------------------------------------
        {
            "report_id"    : int,
            "cattle_id"    : int,
            "tag_number"   : str,
            "filename"     : str,
            "status"       : "pending_summarization",
            "detail"       : "Report uploaded. AI summarisation is in progress.",
            "poll_url"     : "/api/vet-reports/{id}/"
        }

        Response 400 — validation error
        Response 404 — cattle not found
        Response 413 — file too large
        Response 415 — unsupported file type
      summary: Submit Data
      tags:
      - vet-reports
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    ActionTypeEnum:
      enum:
      - created
      - updated
      - deleted
      type: string
      description: |-
        * `created` - Created
        * `updated` - Updated
        * `deleted` - Deleted
    AlertTypeEnum:
      enum:
      - HEAT_DUE
      - BEST_BREED_WINDOW
      - PREGNANCY_CHECK_DUE
      - CALVING_SOON
      type: string
      description: |-
        * `HEAT_DUE` - Heat Due
        * `BEST_BREED_WINDOW` - Best Breeding Window
        * `PREGNANCY_CHECK_DUE` - Pregnancy Check Due
        * `CALVING_SOON` - Calving Soon
    AnimalHistory:
      type: object
      description: |-
        Read-only serializer for AnimalHistory audit log entries.

        ``changed_by_username`` surfaces the actor's username without exposing
        the full user object.
      properties:
        id:
          type: integer
          readOnly: true
        action_type:
          allOf:
          - $ref: '#/components/schemas/ActionTypeEnum'
          readOnly: true
        changed_at:
          type: string
          format: date-time
          readOnly: true
        changed_by_username:
          type: string
          nullable: true
          description: Return the username of the actor, or None if the user was deleted.
          readOnly: true
        changed_fields:
          readOnly: true
        previous_values:
          readOnly: true
      required:
      - action_type
      - changed_at
      - changed_by_username
      - changed_fields
      - id
      - previous_values
    ArtificialInsemination:
      type: object
      description: |-
        Serializer for ArtificialInsemination records.

        Read fields
        -----------
        cattle_tag    : str — tag_number of the related Cattle
        days_since_ai : int — calendar days elapsed since ai_date (None if future)

        Write fields
        ------------
        cattle_id     : int — FK write path
      properties:
        id:
          type: integer
          readOnly: true
        cattle_id:
          type: integer
          writeOnly: true
        cattle_tag:
          type: string
          readOnly: true
        ai_date:
          type: string
          format: date
        semen_bull_name:
          type: string
          maxLength: 150
        semen_batch_id:
          type: string
          maxLength: 100
        technician_name:
          type: string
          maxLength: 150
        notes:
          type: string
        outcome:
          $ref: '#/components/schemas/OutcomeEnum'
        days_since_ai:
          type: integer
          nullable: true
          description: Calendar days elapsed since the AI date.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - ai_date
      - cattle_id
      - cattle_tag
      - created_at
      - days_since_ai
      - id
      - semen_batch_id
      - semen_bull_name
      - technician_name
      - updated_at
    BlankEnum:
      enum:
      - ''
    BreedingAlert:
      type: object
      description: |-
        Serializer for BreedingAlert.

        cattle_tag is exposed as a read-only convenience field.
        cattle_id is the write path.
      properties:
        id:
          type: integer
          readOnly: true
        cattle_id:
          type: integer
          writeOnly: true
        cattle_tag:
          type: string
          readOnly: true
        alert_type:
          $ref: '#/components/schemas/AlertTypeEnum'
        scheduled_date:
          type: string
          format: date
        message:
          type: string
        is_sent:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - alert_type
      - cattle_id
      - cattle_tag
      - created_at
      - id
      - message
      - scheduled_date
    CalfGenderEnum:
      enum:
      - Male
      - Female
      - Unknown
      type: string
      description: |-
        * `Male` - Male
        * `Female` - Female
        * `Unknown` - Unknown
    Cattle:
      type: object
      description: |-
        Full Cattle serializer used for create, retrieve, and update operations.

        Extra computed field
        --------------------
        age_years : float
            Derived from ``date_of_birth``; read-only, not stored in the DB.

        Validation
        ----------
        * ``tag_number`` must be unique (checked against existing records,
          skipping the current instance on updates).
        * ``date_of_birth`` must not be in the future.
      properties:
        id:
          type: integer
          readOnly: true
        tag_number:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 100
        breed:
          type: string
          maxLength: 100
        date_of_birth:
          type: string
          format: date
        age_years:
          type: number
          format: double
          description: Cattle age in fractional years, computed from date_of_birth.
          readOnly: true
        gender:
          $ref: '#/components/schemas/GenderEnum'
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        purchase_date:
          type: string
          format: date
          nullable: true
        is_active:
          type: boolean
        notes:
          type: string
          maxLength: 1000
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - age_years
      - breed
      - created_at
      - date_of_birth
      - gender
      - id
      - name
      - tag_number
      - updated_at
    CattleList:
      type: object
      description: |-
        Lightweight Cattle serializer used in list responses.

        Omits ``notes``, ``purchase_date``, and timestamp fields to reduce
        payload size when fetching many records.  Includes ``age_years`` because
        it's useful for table-row display without a detail fetch.
      properties:
        id:
          type: integer
          readOnly: true
        tag_number:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        breed:
          type: string
          readOnly: true
        gender:
          allOf:
          - $ref: '#/components/schemas/GenderEnum'
          readOnly: true
        date_of_birth:
          type: string
          format: date
          readOnly: true
        age_years:
          type: number
          format: double
          description: Compute and return age in fractional years.
          readOnly: true
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - age_years
      - breed
      - date_of_birth
      - gender
      - id
      - is_active
      - name
      - tag_number
      - weight_kg
    GenderEnum:
      enum:
      - Male
      - Female
      type: string
      description: |-
        * `Male` - Male
        * `Female` - Female
    HeatCycleLog:
      type: object
      description: |-
        Serializer for HeatCycleLog records.

        Read fields
        -----------
        cattle_tag : str — tag_number of the related Cattle

        Write fields
        ------------
        cattle_id  : int — FK write path (accepts Cattle PK)
      properties:
        id:
          type: integer
          readOnly: true
        cattle_id:
          type: integer
          writeOnly: true
          description: PK of the active Cattle to associate this heat log with.
        cattle_tag:
          type: string
          readOnly: true
          description: Tag number of the cattle (read-only).
        observed_date:
          type: string
          format: date
        signs:
          type: string
        intensity:
          $ref: '#/components/schemas/IntensityEnum'
        recorded_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cattle_id
      - cattle_tag
      - created_at
      - id
      - intensity
      - observed_date
      - recorded_by
    IntensityEnum:
      enum:
      - WEAK
      - MODERATE
      - STRONG
      type: string
      description: |-
        * `WEAK` - Weak
        * `MODERATE` - Moderate
        * `STRONG` - Strong
    MilkLog:
      type: object
      description: |-
        Full MilkLog serializer.

        Read fields
        -----------
        cattle_tag  : str   — tag_number of the related Cattle (display-only)
        total_litres: Decimal — auto-computed by the model; included in responses

        Write fields
        ------------
        cattle_id   : int   — FK write path (accepts the Cattle PK on POST/PUT)

        Validation
        ----------
        1. morning_litres must be >= 0
        2. evening_litres must be >= 0
        3. morning_litres + evening_litres must not exceed MAX_DAILY_LITRES (60 L)
        4. date must not be in the future
        5. (cattle, date) must be unique — checked against DB, skipping self on update
      properties:
        id:
          type: integer
          readOnly: true
        cattle_id:
          type: integer
          writeOnly: true
          description: PK of the Cattle record to associate this log with.
        cattle_tag:
          type: string
          readOnly: true
          description: Tag number of the cattle (read-only).
        date:
          type: string
          format: date
        morning_litres:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        evening_litres:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        total_litres:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
          readOnly: true
        recorded_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cattle_id
      - cattle_tag
      - created_at
      - date
      - evening_litres
      - id
      - morning_litres
      - recorded_by
      - total_litres
    NullEnum:
      enum:
      - null
    OutcomeEnum:
      enum:
      - PENDING
      - CONFIRMED_PREGNANT
      - FAILED
      type: string
      description: |-
        * `PENDING` - Pending
        * `CONFIRMED_PREGNANT` - Confirmed Pregnant
