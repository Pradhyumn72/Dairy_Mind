  /api/breeding/cattle/{cattle_id}/ai-success-prob/:
    get:
      operationId: breeding_cattle_ai_success_prob_retrieve
      description: |-
        Estimate the AI success probability for a cattle.

        GET /api/breeding/cattle/{cattle_id}/ai-success-prob/

        Response 200
        ------------
        {
            "success_probability": float (0.0–1.0),
            "success_percent":     int,
            "confidence":          "HEURISTIC" | "MODEL",
            "key_factors":         [str, ...],
            "recommendation":      str,
            "alert_created":       bool   # True when a breeding window alert was also triggered
        }

        Response 404  — Cattle not found.
      summary: Get Details
      parameters:
      - in: path
        name: cattle_id
        schema:
          type: integer
        required: true
      tags:
      - breeding
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/breeding/cattle/{cattle_id}/predict-breeding/:
    get:
      operationId: breeding_cattle_predict_breeding_retrieve
      description: |-
        Predict the optimal breeding window for a cattle using ML.

        GET /api/breeding/cattle/{cattle_id}/predict-breeding/

        Response 200 — success
        ----------------------
        {
            "predicted_next_heat":   "YYYY-MM-DD",
            "best_ai_date":          "YYYY-MM-DD",
            "optimal_window_start":  "YYYY-MM-DDTHH:MM",
            "optimal_window_end":    "YYYY-MM-DDTHH:MM",
            "avg_cycle_length_days": float,
            "cycles_analyzed":       int,
            "confidence":            "LOW" | "MEDIUM" | "HIGH",
            "alert_created":         bool     # True when best_ai_date is within 5 days
        }

        Response 200 — insufficient data
        ---------------------------------
        { "error": "insufficient_data", "cycles_found": N }

        Response 404  — Cattle not found.
      summary: Get Details
      parameters:
      - in: path
        name: cattle_id
        schema:
          type: integer
        required: true
      tags:
      - breeding
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/breeding/cattle/{cattle_id}/timeline/:
    get:
      operationId: breeding_cattle_timeline_retrieve
      description: |-
        Return the full reproductive history for a single cattle as a
        chronologically sorted timeline merging heat logs, AI events, and
        pregnancy records.

        GET /api/breeding/cattle/{cattle_id}/timeline/

        Response 200
        ------------
        {
            "cattle_id"  : int,
            "tag_number" : str,
            "name"       : str,
            "timeline"   : [
                {
                    "event_type" : "heat_cycle" | "ai_event" | "pregnancy",
                    "date"       : "YYYY-MM-DD",
                    // ... event-type-specific fields
                },
                ...                           // sorted ascending by date
            ]
        }

        Response 404  — Cattle not found.
      summary: Get Details
      parameters:
      - in: path
        name: cattle_id
        schema:
          type: integer
        required: true
      tags:
      - breeding
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/breeding/due-this-week/:
    get:
      operationId: breeding_due_this_week_retrieve
      description: |-
        Return all active pregnancies whose expected_calving_date falls within
        the next 7 calendar days (today through today + 6 inclusive).

        GET /api/breeding/due-this-week/

        Response 200
        ------------
        {
            "period_start" : "YYYY-MM-DD",
            "period_end"   : "YYYY-MM-DD",
            "count"        : int,
            "pregnancies"  : [ ...PregnancyRecordSerializer... ]
        }
      summary: Get Details
      tags:
      - breeding
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
