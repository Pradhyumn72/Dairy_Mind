            "predicted"          : [float, ...],
            "lower_bound"        : [float, ...],
            "upper_bound"        : [float, ...]
        }

        Response 404 — no forecast data available for any cattle.
      summary: Get Details
      tags:
      - forecast
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
