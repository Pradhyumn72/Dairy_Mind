  /api/breeding/alerts/pending/:
    get:
      operationId: breeding_alerts_pending_retrieve
      description: |-
        Return all BreedingAlerts that have not yet been sent (is_sent=False),
        sorted ascending by scheduled_date so the most imminent alerts appear first.

        GET /api/breeding/alerts/pending/

        Response 200
        ------------
        {
            "count"  : int,
            "alerts" : [ ...BreedingAlertSerializer... ]
        }
      summary: Get Details
      tags:
      - breeding
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/breeding/breeding-alerts/:
    get:
      operationId: breeding_breeding_alerts_list
      description: List BreedingAlert items
      summary: List BreedingAlert
      parameters:
      - in: query
        name: alert_type
        schema:
          type: string
          enum:
          - BEST_BREED_WINDOW
          - CALVING_SOON
          - HEAT_DUE
          - PREGNANCY_CHECK_DUE
        description: |-
          * `HEAT_DUE` - Heat Due
          * `BEST_BREED_WINDOW` - Best Breeding Window
          * `PREGNANCY_CHECK_DUE` - Pregnancy Check Due
          * `CALVING_SOON` - Calving Soon
      - in: query
        name: cattle
        schema:
          type: integer
      - in: query
        name: is_sent
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - breeding
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBreedingAlertList'
          description: ''
  /api/breeding/breeding-alerts/{id}/:
