openapi: 3.0.3
info:
  title: DairyMind API
  version: 1.0.0
  description: Smart Dairy Farm Management System API
paths:
  /api/alerts/:
    get:
      operationId: alerts_retrieve
      description: |-
        GET /api/alerts/

        Query params (all optional)
        ---------------------------
        is_resolved : bool  (?is_resolved=false | ?is_resolved=true)
        severity    : str   (?severity=HIGH | MEDIUM | LOW)
        cattle_id   : int   (?cattle_id=3)
        alert_type  : str   (?alert_type=ANOMALY | MANUAL | FORECAST)

        Response 200
        ------------
        {
            "count"  : int,
            "results": [ ...HealthAlert objects... ]
        }
      summary: Get Details
      tags:
      - alerts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/alerts/{id}/:
    get:
      operationId: alerts_retrieve_2
      description: GET /api/alerts/{id}/
      summary: Get Details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - alerts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/alerts/{id}/acknowledge/:
    post:
      operationId: alerts_acknowledge_create
      description: POST /api/alerts/{id}/acknowledge/
      summary: Submit Data
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - alerts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/alerts/run-check/:
    post:
      operationId: alerts_run_check_create
      description: |-
        Manually trigger the ML anomaly check for all active cattle.

        POST /api/alerts/run-check/

        Response 202
        ------------
        {
            "detail"  : "Anomaly check task enqueued.",
            "task_id" : str   // Celery task ID
        }
      summary: Submit Data
      tags:
      - alerts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/breeding/ai/:
    get:
      operationId: breeding_ai_list
      description: List ArtificialInsemination items
      summary: List ArtificialInsemination
      parameters:
      - in: query
        name: cattle
        schema:
          type: integer
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: outcome
        schema:
          type: string
          enum:
          - CONFIRMED_PREGNANT
          - FAILED
          - PENDING
        description: |-
          * `PENDING` - Pending
          * `CONFIRMED_PREGNANT` - Confirmed Pregnant
          * `FAILED` - Failed
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - breeding
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArtificialInseminationList'
          description: ''
    post:
      operationId: breeding_ai_create
      description: Create a new ArtificialInsemination
      summary: Create ArtificialInsemination
      tags:
      - breeding
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtificialInsemination'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArtificialInsemination'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArtificialInsemination'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtificialInsemination'
          description: ''
  /api/breeding/ai/{id}/:
    get:
      operationId: breeding_ai_retrieve
      description: Get ArtificialInsemination details
      summary: Retrieve ArtificialInsemination
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Artificial Insemination.
        required: true
      tags:
      - breeding
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtificialInsemination'
          description: ''
    put:
      operationId: breeding_ai_update
      description: Full update ArtificialInsemination
      summary: Update ArtificialInsemination
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Artificial Insemination.
        required: true
      tags:
      - breeding
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtificialInsemination'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArtificialInsemination'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArtificialInsemination'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtificialInsemination'
          description: ''
    patch:
      operationId: breeding_ai_partial_update
      description: Partial update ArtificialInsemination
      summary: Partial Update ArtificialInsemination
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Artificial Insemination.
        required: true
      tags:
      - breeding
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArtificialInsemination'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArtificialInsemination'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArtificialInsemination'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtificialInsemination'
          description: ''
    delete:
      operationId: breeding_ai_destroy
      description: Delete ArtificialInsemination
      summary: Delete ArtificialInsemination
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Artificial Insemination.
        required: true
      tags:
      - breeding
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/breeding/ai/{id}/mark-outcome/:
    post:
      operationId: breeding_ai_mark_outcome_create
      description: Mark Outcome endpoint
      summary: Mark Outcome
      parameters:
      - in: path
        name: id
        schema:
          type: integer
