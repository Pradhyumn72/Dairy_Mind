        cattle_id:
          type: integer
          writeOnly: true
        cattle_tag:
          type: string
          readOnly: true
        ai_date:
          type: string
          format: date
        semen_bull_name:
          type: string
          maxLength: 150
        semen_batch_id:
          type: string
          maxLength: 100
        technician_name:
          type: string
          maxLength: 150
        notes:
          type: string
        outcome:
          $ref: '#/components/schemas/OutcomeEnum'
        days_since_ai:
          type: integer
          nullable: true
          description: Calendar days elapsed since the AI date.
